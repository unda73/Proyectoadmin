<!-- Contenedor principal del módulo de Ingresos.
     Permite aplicar estilos exclusivos a esta pantalla. -->
<div class="ingresos-modulo">

    <!-- Título y descripción de la pantalla. -->
    <header class="ing-encabezado">
        <h2>Alta de ingresos</h2>
        <p>
            Registra el dinero recibido por turno y separa cada método de pago.
        </p>
    </header>

    <!-- Distribuye el contenido en dos columnas:
         izquierda: captura; derecha: resumen. -->
    <div class="ing-distribucion">

        <!-- COLUMNA IZQUIERDA: formularios y detalle de pagos. -->
        <div class="ing-captura">

            <!-- Formulario de los datos generales.
                 El botón Registrar ingreso está más abajo y se
                 conecta con este formulario mediante form="ing-datos". -->
            <form id="ing-datos" class="ing-fila">

                <!-- Fecha del ingreso. -->
                <div class="ing-campo">
                    <label for="ing-fecha">Fecha *</label>
                    <input
                        type="date"
                        id="ing-fecha"
                        required>
                </div>

                <!-- Turno al que corresponde el ingreso.
                     La opción vacía obliga a seleccionar un turno. -->
                <div class="ing-campo">
                    <label for="ing-turno">Turno *</label>

                    <select id="ing-turno" required>
                        <option value="">Selecciona un turno</option>
                        <option value="Matutino">Matutino</option>
                        <option value="Vespertino">Vespertino</option>
                    </select>
                </div>

                <!-- Persona responsable del ingreso.
                     Por ahora utilizamos un nombre de ejemplo. -->
                <div class="ing-campo">
                    <label for="ing-responsable">Responsable *</label>

                    <select id="ing-responsable" required>
                        <option value="">Selecciona un responsable</option>
                        <option value="Sergio">Sergio</option>
                    </select>
                </div>

            </form>

            <!-- Panel que contiene la captura y la lista de pagos. -->
            <div class="ing-panel">

                <h3>Agregar método de pago</h3>

                <!-- Formulario independiente para agregar un pago.
                     Agregar un pago todavía no registra el ingreso completo. -->
                <form id="ing-formulario-pago">

                    <!-- Agrupa los tres campos en una fila. -->
                    <div class="ing-fila">

                        <!-- Selección del método de pago.
                             JavaScript utiliza estos valores para clasificar
                             los importes y calcular el resumen. -->
                        <div class="ing-campo">
                            <label for="ing-metodo">Método de pago *</label>

                            <select id="ing-metodo" required>
                                <option value="efectivo">Efectivo</option>
                                <option value="tarjeta">Tarjeta</option>
                                <option value="transferencia">
                                    Transferencia
                                </option>
                            </select>
                        </div>

                        <!-- Terminal o cuenta que recibió el dinero.
                             Empieza deshabilitada porque Efectivo no la necesita.
                             JavaScript la habilita y cambia sus opciones. -->
                        <div class="ing-campo">
                            <label for="ing-destino">Terminal o cuenta</label>

                            <select id="ing-destino" disabled>
                                <option value="">No aplica</option>
                            </select>
                        </div>

                        <!-- Importe del pago.
                             min: cantidad mínima permitida.
                             max: cantidad máxima permitida.
                             step: permite cantidades en incrementos de un centavo.
                             required: el campo es obligatorio. -->
                        <div class="ing-campo">
                            <label for="ing-importe">Importe *</label>

                            <input
                                type="number"
                                id="ing-importe"
                                min="0.01"
                                max="999999999.99"
                                step="0.01"
                                placeholder="0.00"
                                required>
                        </div>

                    </div>

                    <!-- Envía únicamente el formulario de pago.
                         JavaScript agrega el pago al detalle. -->
                    <div class="ing-acciones">
                        <button type="submit" class="ing-boton">
                            Agregar pago
                        </button>
                    </div>

                </form>

                <!-- Lista de los pagos que forman el ingreso. -->
                <h4>Detalle de ingresos</h4>

                <!-- Contenedor para controlar el espacio de la tabla
                     y permitir desplazamiento si el CSS lo establece. -->
                <div class="ing-tabla-contenedor">

                    <table class="ing-tabla">

                        <!-- Encabezados de las columnas. -->
                        <thead>
                            <tr>
                                <th scope="col">Método</th>
                                <th scope="col">Terminal o cuenta</th>
                                <th scope="col">Importe</th>
                                <th scope="col">Acción</th>
                            </tr>
                        </thead>

                        <!-- JavaScript insertará aquí las filas de pagos
                             y sus botones para eliminarlos. -->
                        <tbody id="ing-detalle"></tbody>

                    </table>

                </div>

                <!-- Acciones del ingreso completo. -->
                <div class="ing-acciones">

                    <!-- type="button" evita enviar un formulario.
                         JavaScript controla la cancelación. -->
                    <button
                        type="button"
                        id="ing-cancelar"
                        class="ing-boton ing-secundario">
                        Cancelar
                    </button>

                    <!-- Aunque está fuera del formulario ing-datos,
                         el atributo form lo conecta con él.
                         Al pulsarlo se validan fecha, turno y responsable. -->
                    <button
                        type="submit"
                        form="ing-datos"
                        class="ing-boton">
                        Registrar ingreso
                    </button>

                </div>

                <!-- Espacio para mensajes de validación o confirmación.
                     Este ID debe aparecer una sola vez en el documento. -->
                <p id="ing-aviso" role="status"></p>

            </div>

        </div>
        <!-- Fin de la columna izquierda: ing-captura. -->

        <!-- COLUMNA DERECHA: resumen de los pagos.
             Está dentro de ing-distribucion, junto a ing-captura. -->
   <!-- Resumen de los ingresos de la fecha seleccionada.
     Separa los importes por turno y muestra el total del día. -->
<!-- Resumen de ingresos de la fecha seleccionada. -->
<aside class="ing-panel ing-resumen">

    <h3>Resumen de ingresos</h3>

    <!-- Aquí mostraremos la fecha que estamos consultando. -->
    <p id="ing-fecha-resumen" class="ing-nota"></p>

    <!-- Ingresos correspondientes al turno matutino. -->
    <div class="ing-tarjeta-turno">
        <span>Matutino</span>
        <strong id="ing-total-matutino">$0.00</strong>
    </div>

    <!-- Ingresos correspondientes al turno vespertino. -->
    <div class="ing-tarjeta-turno">
        <span>Vespertino</span>
        <strong id="ing-total-vespertino">$0.00</strong>
    </div>

    <!-- Suma de ambos turnos de ese día. -->
    <div class="ing-tarjeta-dia">
        <span>TOTAL DEL DÍA</span>
        <strong id="ing-total-dia">$0.00</strong>
    </div>

    <!-- Explicación del resumen, que completará JavaScript. -->
    <p id="ing-nota-resumen" class="ing-nota" role="status"></p>

</aside>
    </div>
    <!-- Fin de la distribución de las dos columnas. -->

    <!-- Aviso sobre el funcionamiento de esta versión de prueba. -->
    <p class="ing-nota">
        ED
    </p>

</div>
<!-- Fin del módulo de Ingresos. -->
